name: Update Dependencies (Internal)
on:
  workflow_dispatch:
  schedule:
    - cron: 0 21 * * 5

jobs:
  update-dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/update-dependencies.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      update_pnpm: true
      update_javascript_dependencies: true
      update_actions: true
      update_python_dependencies: true

  build-composite-actions-like-a-caveman:
    runs-on: ubuntu-latest
    needs: [update-dependencies]
    permissions:
      contents: write
      pull-requests: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout the pull request branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ needs.update-dependencies.outputs.pull-request-number }}
        run: gh pr checkout "$PULL_REQUEST_NUMBER"

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the composite actions
        run: pnpm run build

      - name: Setup GitHub user
        uses: $/composite/configure-github-bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Commit the build like a caveman because GitHub Actions is garbage
        uses: $/.github/actions/commit-changes
        with:
          message: "Build the composite actions"

      - name: Now to face the workflow of the damned, I've gotta push the changes to the branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ needs.update-dependencies.outputs.pull-request-branch }}
        run: git push origin "$BRANCH_NAME"

name: Publish to GitHub Pages
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        type: string
        required: true
      path:
        description: The path to the directory to publish. It must have an index.html file inside of it.
        required: true
        type: string
      build-configs:
        description: Build the configuration files that may be needed to generate the documentation.
        required: false
        default: false
        type: boolean
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"

jobs:
  publish-github-pages:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the configs
        if: ${{ inputs.build-configs == true }}
        run: pnpm run build-configs

      - name: Create the feature docs
        run: pnpm run create-feature-docs

      - name: Upload the feature docs
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ inputs.path }}

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pages: write

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

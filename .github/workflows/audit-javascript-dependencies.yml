name: Comment outdated dependencies

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        required: true
        type: string
      pull-request-number:
        required: true
        type: number
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"

jobs:
  audit-javascript-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install alex-c-line
        uses: $/composite/safe-npm-dependency-global-install
        with:
          package-name: alex-c-line
          dependency-group: devDependencies
          strict-version-resolution: false

      - name: Audit the dependencies
        run: alex-c-line internal dependency-audit --output audit.md

      - name: Upload the audit results to be used in comment
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-results
          path: audit.md

  comment-result:
    needs: audit-javascript-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download audit results
        uses: actions/download-artifact@v8.0.2
        with:
          name: audit-results

      - name: Find comment
        id: find_comment
        uses: peter-evans/find-comment@v4.0.0
        with:
          issue-number: ${{ inputs.pull-request-number }}
          comment-author: "alex-up-bot[bot]"
          body-includes: # JavaScript Dependency Audit

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Comment audit results on the pull request
        uses: peter-evans/create-or-update-comment@v5.0.0
        id: create-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.pull-request-number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body-path: audit.md

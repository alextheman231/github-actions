name: PNPM CI

on:
  workflow_call:
    inputs:
      use_playwright:
        description: "Install the necessary system dependencies for Playwright"
        required: false
        default: false
        type: boolean
      os:
        description: "The operating systems to run the workflow on"
        required: false
        default: '["ubuntu-latest"]' # Lol this is stupid!
        type: string
      run_build:
        description: "Run the build step"
        type: boolean
        required: false
        default: true
      node-version:
        description: The Node version to use
        type: string # Because who needs fancy union types when everything can just be a string amiright?
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  source-code-ci-lint:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }} # VERY stupid!
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        if: ${{ inputs.run_build == true }}
        run: pnpm run build

      - name: Run linting checks
        run: pnpm run lint

  source-code-ci-test:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }} # VERY stupid!
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.use_playwright == true }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'playwright.config.ts') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: ${{ inputs.use_playwright == true }}
        run: pnpm exec playwright install --with-deps

      - name: Build package
        if: ${{ inputs.run_build == true }}
        run: pnpm run build

      - name: Run tests
        run: pnpm test

  source-code-ci:
    needs: [source-code-ci-lint, source-code-ci-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report on any matrix failures
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

name: Create feature docs

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        type: string
        required: true
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-feature-docs:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Setup GitHub user
        uses: $/composite/configure-github-bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Use PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the package
        run: pnpm run build

      - name: Create feature docs
        run: pnpm run create-feature-docs

      - name: Commit the feature docs creation
        uses: $/.github/actions/commit-changes
        with:
          message: Create feature docs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: alex-up-bot/create-feature-docs
          base: main
          title: "Create feature docs"
          body-path: .github/PULL_REQUEST_TEMPLATE/documentation_change.md

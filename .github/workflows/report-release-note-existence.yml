name: Check release note
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        type: string
        required: true
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"
    outputs:
      release-note-found:
        description: Whether or not the release note was found.
        value: ${{ jobs.check-release-note.outputs.release-note-found }}
      release-note-path:
        description: The path to the release note.
        value: ${{ jobs.check-release-note.outputs.release-note-path }}

jobs:
  check-release-note:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release-note-found: ${{ steps.check-version.outputs.release_note_found }}
      release-note-path: ${{ steps.check-version.outputs.release_note_found == 'true' && steps.get-release-path.outputs.release_note_path || '' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install alex-c-line
        uses: $/composite/safe-npm-dependency-global-install
        with:
          package-name: alex-c-line
          dependency-group: devDependencies
          strict-version-resolution: false

      - name: Get package data from package.json
        id: get-package-data
        uses: $/composite/get-package-metadata

      - name: Get release note path
        id: get-release-path
        env:
          VERSION: ${{ steps.get-package-data.outputs.package-version }}
        run: |
          RELEASE_NOTE_PATH=$(alex-c-line template release-note path "$VERSION")
          echo "release_note_path=$RELEASE_NOTE_PATH" >> "$GITHUB_OUTPUT"

      - name: Check if release document already exists
        id: check-version
        env:
          VERSION: ${{ steps.get-package-data.outputs.package-version }}
          RELEASE_NOTE_PATH: ${{ steps.get-release-path.outputs.release_note_path }}
        run: |
          if [ ! -f "$RELEASE_NOTE_PATH" ]; then
            echo "No release document found for $VERSION."
            echo "release_note_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release note found for $VERSION..."
            echo "release_note_found=true" >> "$GITHUB_OUTPUT"
          fi

name: Commit a version change (implementation)
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        type: string
        required: true
      run-build:
        description: "Whether to run the build step or not"
        required: false
        default: false
        type: boolean
      version-type:
        description: "The version type to increment by"
        type: string
        required: true
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION_TYPE: ${{ inputs.version-type }}
    outputs:
      release_doc_path: ${{ steps.release_document_path.outputs.path }}
      should_change_version: ${{ steps.release_document_path.outputs.should_change_version }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install alex-c-line
        uses: $/composite/safe-npm-dependency-global-install
        with:
          package-name: alex-c-line
          dependency-group: devDependencies
          strict-version-resolution: false

      - name: Get the current version number
        id: get_current_version
        run: |
          VERSION=v$(jq -r ".version" package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get next version
        env:
          VERSION: ${{ steps.get_current_version.outputs.version }}
          VERSION_TYPE: ${{ env.VERSION_TYPE }}
        id: get_next_version
        run: |
          NEXT_VERSION=$(alex-c-line version increment "$VERSION" "$VERSION_TYPE")
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Find release document
        env:
          NEXT_VERSION: ${{ steps.get_next_version.outputs.next_version }}
        id: release_document_path
        run: |
          RELEASE_DOC_PATH=$(alex-c-line template release-note path "$NEXT_VERSION")
          if [[ -f "$RELEASE_DOC_PATH" ]]; then
            echo "Release document found. Continuing..."
            echo "path=$RELEASE_DOC_PATH" >> "$GITHUB_OUTPUT"
            echo "should_change_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release document found. Skipping..."
            echo "should_change_version=false" >> "$GITHUB_OUTPUT"
          fi

  commit-version-change:
    runs-on: ubuntu-latest
    needs: check-version
    if: ${{ needs.check-version.outputs.should_change_version == 'true' }}
    env:
      HUSKY: 0
      VERSION_TYPE: ${{ inputs.version-type }}
      RELEASE_DOC_PATH: ${{ needs.check-version.outputs.release_doc_path }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Change version
        env:
          VERSION_TYPE: ${{ env.VERSION_TYPE }}
        run: npm version "$VERSION_TYPE" --no-git-tag-version

      - name: Get the new version number
        id: get_new_version
        run: |
          VERSION=v"$(jq -r ".version" package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install alex-c-line
        uses: $/composite/safe-npm-dependency-global-install
        with:
          package-name: alex-c-line
          dependency-group: devDependencies
          strict-version-resolution: false

      - name: Change the status in the release document
        env:
          RELEASE_DOC_PATH: ${{ env.RELEASE_DOC_PATH }}
        run: alex-c-line template release-note set-status "$RELEASE_DOC_PATH"

      - name: Determine risk level
        id: risk-level
        env:
          VERSION_TYPE: ${{ env.VERSION_TYPE }}
        run: |
          case "$VERSION_TYPE" in
            major)
              echo "risk=high risk" >> "$GITHUB_OUTPUT"
              ;;
            minor)
              echo "risk=medium risk" >> "$GITHUB_OUTPUT"
              ;;
            patch)
              echo "risk=low risk" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Invalid version type."
              exit 1
              ;;
          esac

      - name: Setup GitHub user
        uses: $/composite/configure-github-bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Commit the version change
        uses: $/.github/actions/commit-changes
        with:
          message: "Change version number to ${{ steps.get_new_version.outputs.version }}"

      - name: Create Pull Request
        id: pull-request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: alex-up-bot/change-${{ env.VERSION_TYPE }}-version
          base: main
          title: "Change version number to ${{ steps.get_new_version.outputs.version }}"
          maintainer-can-modify: false
          body-path: ${{ env.RELEASE_DOC_PATH }}

      - name: Add risk label, tooling, and documentation label to the pull request
        env:
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          RISK_LABEL: ${{ steps.risk-level.outputs.risk }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit "$PULL_REQUEST_URL" --add-label "$RISK_LABEL,tooling,documentation"

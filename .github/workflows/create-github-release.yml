name: Create GitHub Release
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
    inputs:
      CLIENT_ID:
        type: string
        required: true
      node-version:
        description: The Node version to use
        type: string
        required: false
        default: "22"
      tag:
        description: The tag to use for the release
        type: string
        required: true
      release-note-path:
        description: The path to the release note
        type: string
        required: true

jobs:
  create-github-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NOTE_PATH: ${{ inputs.release-note-path }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --notes-file "$RELEASE_NOTE_PATH"

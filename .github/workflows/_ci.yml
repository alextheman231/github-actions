name: Self CI (Internal)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

jobs:
  actions-ci:
    permissions:
      contents: read
    uses: $/.github/workflows/actions-ci.yml
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  composite-ci:
    permissions:
      contents: read
    uses: $/.github/workflows/package-ci.yml

  build-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build the composite actions
        run: pnpm run build

      - name: Ensure the working tree is clean
        run: |
          git add .
          git diff --cached --quiet

  secret-scan-ci:
    permissions:
      contents: read
    uses: $/.github/workflows/secret-scan-ci.yml
    with:
      github-push-before-sha: ${{ github.event.before }}
      github-push-base-sha: ${{ github.event.base_ref }}
      github-pull-base-sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

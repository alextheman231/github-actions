name: Actions CI

on:
  workflow_call:
    inputs:
      CLIENT_ID:
        type: string
        required: true
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  actions-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Setup PDM
        run: pip install pdm

      - name: Install Python dependencies
        run: pdm install

      - name: Install Go
        uses: actions/setup-go@v7.0.0

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-actions: read
          permission-workflows: read

      - name: Run zizmor
        run: pdm run lint-zizmor

      - name: Run actionlint
        run: actionlint

      - name: Verify the actions lockfile
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh actions-lock --verify

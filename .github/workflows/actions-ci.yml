name: Actions CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actions-ci:
    if: ${{ github.head_ref != 'alex-up-bot/change-major-version' && github.head_ref != 'alex-up-bot/change-minor-version' && github.head_ref != 'alex-up-bot/change-patch-version' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock

      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-actions: read
          permission-workflows: read

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false

      - name: Run actionlint
        run: actionlint

      - name: Verify the actions lockfile
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh actions-lock --verify

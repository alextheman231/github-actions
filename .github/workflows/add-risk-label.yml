name: Add risk label

on:
  workflow_call:
    inputs:
      APP_ID:
        type: string
        required: true
    secrets:
      APP_PRIVATE_KEY:
        required: true

jobs:
  check-risk-level:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      label: ${{ steps.risk-label.outputs.label }}
    steps:
      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: read

      - name: Get risk level from pull request
        id: risk-level
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          RISK_LEVEL="$(
            sed -nE 's/^[[:space:]]*## Risk level: (Low|Medium|High)[[:space:]]*$/\1/p' <<< "$PULL_REQUEST_BODY"
          )"
          echo "risk-level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

      - name: Get risk label name
        id: risk-label
        uses: alextheman231/typescript-actions/actions/get-risk-label-name@f142a767503c546e9dcae30276cf2069dc0b3000 # v1.3.3
        with:
          risk-level: ${{ steps.risk-level.outputs.risk-level }}

  add-risk-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    needs: [check-risk-level]
    if: ${{ needs.check-risk-level.outputs.label == 'low risk' || needs.check-risk-level.outputs.label == 'medium risk' || needs.check-risk-level.outputs.label == 'high risk' }}
    steps:
      - name: Get alex-up-bot GitHub token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Add label to pull request
        uses: alextheman231/typescript-actions/actions/add-risk-label@f142a767503c546e9dcae30276cf2069dc0b3000 # v1.3.3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          label-to-add: ${{ needs.check-risk-level.outputs.label }}
          github-token: ${{ steps.app-token.outputs.token }}
          github-repository: ${{ github.repository }}

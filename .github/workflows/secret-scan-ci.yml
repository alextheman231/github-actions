name: Secret Scan

on:
  workflow_call:
    secrets:
      GITGUARDIAN_API_KEY:
        description: "API key to use with GitGuardian"
        required: true
    inputs:
      github-push-before-sha:
        type: string
        required: true
      github-push-base-sha:
        type: string
        required: true
      github-pull-base-sha:
        type: string
        required: true
      github-default-branch:
        type: string
        required: false
        default: main

jobs:
  secret-scan-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request for secrets
        uses: GitGuardian/ggshield/actions/secret@9124e4c246c16c7e58398ad4aa23dae5a90a9aae # v1.56.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ inputs.github-push-before-sha }}
          GITHUB_PUSH_BASE_SHA: ${{ inputs.github-push-base-sha }}
          GITHUB_PULL_BASE_SHA: ${{ inputs.github-pull-base-sha }}
          GITHUB_DEFAULT_BRANCH: ${{ inputs.github-default-branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

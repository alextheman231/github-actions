name: "Commit Changes"
description: "Commit changes and set the changes_detected output to true if changes are present, otherwise set the changes_detected output to false."

inputs:
  message:
    description: "The commit message"
    required: true
    type: string
  path:
    description: "The path to commit"
    required: false
    default: "-A"

outputs:
  changes_detected:
    description: "Whether changes were detected and committed"
    value: ${{ steps.commit_changes.outputs.changes_detected }}

runs:
  using: composite
  steps:
    - name: Commit changes
      id: commit_changes
      env:
        MESSAGE: ${{ inputs.message }}
        COMMIT_PATH: ${{ inputs.path }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git add "$COMMIT_PATH"
          git commit -m "$MESSAGE"
          echo "changes_detected=true" >> "$GITHUB_OUTPUT"
        else
          echo "No changes detected."
          echo "changes_detected=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
